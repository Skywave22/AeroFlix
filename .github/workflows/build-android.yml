name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with: { flutter-version: '3.27.3', channel: 'stable', cache: true }
      - name: Install dependencies
        run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build APK (debug)
        run: flutter build apk --debug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with: { name: aeroflix-debug-apk, path: build/app/outputs/flutter-apk/app-debug.apk }

  build-release:
    name: Build release APK
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with: { flutter-version: '3.27.3', channel: 'stable', cache: true }
      - name: Install dependencies
        run: flutter pub get
      - name: Build APK (release, unsigned)
        run: flutter build apk --release --no-shrink
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with: { name: aeroflix-release-apk, path: build/app/outputs/flutter-apk/app-release.apk }
