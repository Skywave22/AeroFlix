name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with: { distribution: 'temurin', java-version: '17' }
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with: { flutter-version: '3.27.3', channel: 'stable', cache: true }
      - name: Install Android SDK 36 + NDK 27 (required by media_kit)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDK_MANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            # subosito/flutter-action installs cmdline-tools under a different path
            SDK_MANAGER=$(find "$ANDROID_SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          echo "Using sdkmanager: $SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null 2>&1 || true
          "$SDK_MANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Install dependencies
        run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Run tests
        run: flutter test --no-pub --timeout 30s
      - name: Build APK (debug)
        run: flutter build apk --debug --no-pub
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with: { name: aeroflix-debug-apk, path: build/app/outputs/flutter-apk/app-debug.apk, if-no-files-found: error }

  build-release:
    name: Build release APK
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with: { distribution: 'temurin', java-version: '17' }
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with: { flutter-version: '3.27.3', channel: 'stable', cache: true }
      - name: Install Android SDK 36 + NDK 27 (required by media_kit)
        run: |
          SDK_MANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER=$(find "$ANDROID_SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          echo "Using sdkmanager: $SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null 2>&1 || true
          "$SDK_MANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Install dependencies
        run: flutter pub get
      - name: Build APK (release, unsigned)
        run: flutter build apk --release --no-shrink --no-pub
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with: { name: aeroflix-release-apk, path: build/app/outputs/flutter-apk/app-release.apk, if-no-files-found: error }
