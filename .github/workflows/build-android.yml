name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Flutter 3.50 / Dart 3.14 — required by the QuickJS-NG engine that runs the
  # TJ provider bundles (quickjs_engine needs Dart >= 3.8) and by the current
  # media_kit_video SurfaceProducer API.
  FLUTTER_VERSION: 3.50.0
  NDK_VERSION: 27.0.12077973
  CMAKE_VERSION: 3.22.1

jobs:
  verify:
    name: Format, analyze, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting (app + vendored provider package)
        run: dart format --output=none --set-exit-if-changed lib test packages/tj_flutter_providers/lib packages/tj_flutter_providers/test

      - name: Analyze (fatal on errors/warnings)
        run: flutter analyze --no-pub

      - name: Run app tests
        run: flutter test --no-pub --timeout 120s

      # packages/tj_flutter_providers has its own offline
      # (provider_manager_test.dart) tests. They were never executed in CI, so
      # a change that broke manifest parsing or version comparison could merge
      # green.
      - name: Run provider package tests
        working-directory: packages/tj_flutter_providers
        run: |
          flutter pub get
          flutter test --timeout 120s


  build-debug:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with: { distribution: 'temurin', java-version: '17' }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Android SDK + NDK + CMake
        run: |
          SDK_MANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER=$(find "$ANDROID_SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          echo "Using sdkmanager: $SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null 2>&1 || true
          "$SDK_MANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (debug)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          EXTRA=""
          if [ -n "${TMDB_API_KEY:-}" ]; then EXTRA="--dart-define=TMDB_API_KEY=$TMDB_API_KEY"; fi
          flutter build apk --debug --no-pub $EXTRA

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aeroflix-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  build-release:
    name: Build release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: verify
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with: { distribution: 'temurin', java-version: '17' }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Android SDK + NDK + CMake
        run: |
          SDK_MANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER=$(find "$ANDROID_SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          echo "Using sdkmanager: $SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null 2>&1 || true
          "$SDK_MANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      # Optional real signing: android/app/build.gradle picks this up through
      # android/key.properties and falls back to the debug keystore when absent.
      - name: Configure release signing (optional)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/aeroflix-release.jks
          cat > android/key.properties <<EOF
          storeFile=aeroflix-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # Split per ABI: the universal APK is ~100 MB because it carries libmpv
      # and QuickJS for four architectures. Per-ABI builds are ~35-40 MB.
      - name: Build APK (release, per-ABI)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          EXTRA=""
          if [ -n "${TMDB_API_KEY:-}" ]; then EXTRA="--dart-define=TMDB_API_KEY=$TMDB_API_KEY"; fi
          # Note: no --no-shrink. The flag disabled R8/tree-shaking for the
          # whole release build purely to work around the lint/analyzer issue
          # already handled by `lint { checkReleaseBuilds = false }`, and it
          # shipped an APK several MB larger than necessary.
          flutter build apk --release --split-per-abi --no-pub $EXTRA --target-platform android-arm,android-arm64

      - name: Warn about missing release keystore
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: |
          echo "::warning::Release APK is signed with the debug key. It cannot be published to Google Play and cannot be updated in place by a properly signed build. Set KEYSTORE_BASE64, KEY_ALIAS, KEY_PASSWORD and STORE_PASSWORD secrets to sign it."

      - name: Upload arm64 APK (most phones)
        uses: actions/upload-artifact@v4
        with:
          name: aeroflix-arm64-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload armv7 APK (older devices)
        uses: actions/upload-artifact@v4
        with:
          name: aeroflix-armv7-apk
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
