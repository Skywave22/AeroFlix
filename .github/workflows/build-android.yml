name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Flutter 3.50 / Dart 3.14 — required by the QuickJS-NG engine that runs the
  # TJ provider bundles (quickjs_engine needs Dart >= 3.8) and by the current
  # media_kit_video SurfaceProducer API.
  FLUTTER_VERSION: 3.50.0
  NDK_VERSION: 27.0.12077973
  CMAKE_VERSION: 3.22.1

jobs:
  verify:
    name: Format, analyze, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Needed by the report steps: they commit the analyzer/test output back to
    # the branch so a failure can be triaged without downloading logs.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The report steps below push to the same branch that `format-apply`
      # also pushes to, so a bare `git push` loses that race and the report is
      # silently discarded. Rebase onto the remote tip first.
      - name: Configure git for report commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify formatting (app + vendored provider package)
        run: |
          set +e
          out=$(dart format --output=none --set-exit-if-changed lib test \
                  packages/tj_flutter_providers/lib \
                  packages/tj_flutter_providers/test 2>&1)
          code=$?
          echo "$out"
          echo "exit=$code"
          if [ "$code" -ne 0 ]; then
            # Emit the formatter's own output as an annotation so the failure is
            # actionable from the UI and the API.
            echo "::error title=Format check output::$out"
            git status --short | head -20
            exit 1
          fi

      - name: Analyze (fatal on errors/warnings)
        # `flutter analyze` exits non-zero for infos too, so capture the report
        # first and only then let the step fail.
        run: |
          flutter analyze --no-pub > analyze-report.txt 2>&1 || true
          echo "---- analyze report ----"
          cat analyze-report.txt
          echo "------------------------"
          if grep -qE '^\s*(error|warning)' analyze-report.txt; then
            # GitHub keeps only the first 10 annotations per step, so emit the
            # count plus as much of the report as fits in one annotation.
            bad=$(grep -cE '^\s*(error|warning)' analyze-report.txt)
            echo "::error title=flutter analyze ($bad errors/warnings)::$(grep -E '^\s*(error|warning)' analyze-report.txt | head -6 | tr '\n' ';' | cut -c1-900)"
            exit 1
          fi

      - name: Run app tests
        run: |
          set +e
          flutter test --no-pub --timeout 120s > test-report.txt 2>&1
          code=$?
          tail -60 test-report.txt
          # Commit the report too: annotation payloads are capped and get
          # dropped when they are too long.
          cp test-report.txt /tmp/test-report.txt
          git add -f test-report.txt && git commit -m "chore: record test report" || true
          git fetch origin ${{ github.ref_name }} || true
          git rebase FETCH_HEAD || true
          git push origin HEAD:${{ github.ref_name }} || true
          if [ "$code" -ne 0 ]; then
            # Always emit something: an empty annotation is dropped by GitHub
            # and the failure then looks unexplainable. Keep the context lines
            # after each failing test, which is where the reason lives.
            summary=$(grep -nE '^[0-9]+:[0-9]+ \+[0-9]+.*-[0-9]+|❌|Expected:|Actual:|Which:|Exception|Test failed' test-report.txt \
              | tail -20 | cut -c1-1100 | tr '\n' '|')
            [ -z "$summary" ] && summary=$(tail -25 test-report.txt | tr '\n' '|' | cut -c1-1500)
            echo "::error title=flutter test failures (exit $code)::$summary"
          fi
          exit "$code"

      # packages/tj_flutter_providers has its own offline
      # (provider_manager_test.dart) tests. They were never executed in CI, so
      # a change that broke manifest parsing or version comparison could merge
      # green.
      - name: Run provider package tests
        working-directory: packages/tj_flutter_providers
        run: |
          set +e
          flutter pub get
          flutter test --timeout 120s > test-report.txt 2>&1
          code=$?
          tail -60 test-report.txt
          git add -f test-report.txt && git commit -m "chore: record provider test report" || true
          git fetch origin ${{ github.ref_name }} || true
          git rebase FETCH_HEAD || true
          git push origin HEAD:${{ github.ref_name }} || true
          exit "$code"


  format-apply:
    # ON-DEMAND maintenance job: applies `dart format` with the exact SDK the
    # verify gate uses and pushes the result. Useful when a change was written
    # on a machine without a local Flutter SDK. It never runs automatically.
    name: Format apply
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # `dart format` picks its style from the package's *language version*,
      # which it only learns from the resolved package config. Without this the
      # formatter silently applies the legacy (short) style and rewrites the
      # whole tree into something the verify gate then rejects.
      - name: Install dependencies (needed for the correct format style)
        run: |
          flutter pub get
          (cd packages/tj_flutter_providers && flutter pub get)

      - name: Format and commit
        run: |
          dart format lib test packages/tj_flutter_providers/lib \
            packages/tj_flutter_providers/test
          if git diff --quiet; then
            echo "Already formatted; nothing to commit."
          else
            git diff --stat
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "style: dart format (applied by CI)"
            git push origin HEAD:${{ github.ref_name }}
          fi

      # Maintainer helper: writes the formatter's actual diff to format.diff so
      # the change can be applied (or understood) without a local SDK.
      - name: Record format diff
        run: |
          set +e
          dart format lib test packages/tj_flutter_providers/lib \
            packages/tj_flutter_providers/test > /dev/null 2>&1
          git diff > format.diff
          wc -l format.diff
          if [ -s format.diff ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -- .
            git add format.diff
            git commit -m "chore: record dart format diff" || true
            git push origin HEAD:${{ github.ref_name }} || true
          fi

  build-debug:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with: { distribution: 'temurin', java-version: '17' }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Android SDK + NDK + CMake
        run: |
          SDK_MANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER=$(find "$ANDROID_SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          echo "Using sdkmanager: $SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null 2>&1 || true
          "$SDK_MANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (debug)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          EXTRA=""
          if [ -n "${TMDB_API_KEY:-}" ]; then EXTRA="--dart-define=TMDB_API_KEY=$TMDB_API_KEY"; fi
          flutter build apk --debug --no-pub $EXTRA

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aeroflix-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  build-release:
    name: Build release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: verify
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with: { distribution: 'temurin', java-version: '17' }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Android SDK + NDK + CMake
        run: |
          SDK_MANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER=$(find "$ANDROID_SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          echo "Using sdkmanager: $SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null 2>&1 || true
          "$SDK_MANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      # Optional real signing: android/app/build.gradle picks this up through
      # android/key.properties and falls back to the debug keystore when absent.
      #
      # Note the guard is a shell `if`, not `if: ${{ secrets.X != '' }}`:
      # the `secrets` context is not available in a step-level `if`, and using
      # it there makes GitHub reject the entire workflow file ("workflow file
      # issue", no jobs are created).
      - name: Configure release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::No KEYSTORE_BASE64 secret; the release APK will be           signed with the debug key. It cannot be published to Google Play or           updated in place by a properly signed build."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/aeroflix-release.jks
          {
            echo "storeFile=aeroflix-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # Split per ABI: the universal APK is ~100 MB because it carries libmpv
      # and QuickJS for four architectures. Per-ABI builds are ~35-40 MB.
      - name: Build APK (release, per-ABI)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          EXTRA=""
          if [ -n "${TMDB_API_KEY:-}" ]; then EXTRA="--dart-define=TMDB_API_KEY=$TMDB_API_KEY"; fi
          # Note: no --no-shrink. The flag disabled R8/tree-shaking for the
          # whole release build purely to work around the lint/analyzer issue
          # already handled by `lint { checkReleaseBuilds = false }`, and it
          # shipped an APK several MB larger than necessary.
          flutter build apk --release --split-per-abi --no-pub $EXTRA --target-platform android-arm,android-arm64

      - name: Upload arm64 APK (most phones)
        uses: actions/upload-artifact@v4
        with:
          name: aeroflix-arm64-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload armv7 APK (older devices)
        uses: actions/upload-artifact@v4
        with:
          name: aeroflix-armv7-apk
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
