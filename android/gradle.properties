org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# AGP 9 ships a new DSL by default; third-party plugins (media_kit, etc.) still
# use the classic one, so opt out until they migrate.
android.newDsl=false
# Flutter applies the Kotlin plugin itself; keep AGP's built-in Kotlin off.
android.builtInKotlin=false
