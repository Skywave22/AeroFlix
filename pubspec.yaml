name: aeroflix
description: "AeroFlix — premium cinematic streaming."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  shared_preferences: ^2.3.3
  equatable: ^2.0.7
  intl: ^0.19.0
  path_provider: ^2.1.5
  wakelock_plus: ^1.2.10
  url_launcher: ^6.3.1
  flutter_animate: ^4.5.2
  media_kit: ^1.1.11
  media_kit_video: ^2.0.1
  media_kit_libs_android_video: ^1.3.5
  share_plus: ^10.0.2
  package_info_plus: ^8.0.2
  app_links: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
